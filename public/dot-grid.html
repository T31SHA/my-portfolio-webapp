<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090b" />
    <title>Dot Grid — Pointer Well</title>
    <style>
      :root {
        color-scheme: dark;
        background: #08090b;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #08090b;
      }

      canvas {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <canvas aria-hidden="true"></canvas>

    <script>
      (() => {
        const canvas = document.querySelector('canvas')
        const context = canvas.getContext('2d', { alpha: false })
        const spacing = 26
        const accent = '#9be9d5'
        const touchMedia = window.matchMedia('(pointer: coarse)')

        let width = 0
        let height = 0
        let pixelRatio = 1
        let points = []
        let targetX = 0
        let targetY = 0
        let easedX = 0
        let easedY = 0
        let hasPointer = false
        let touchMode = touchMedia.matches

        function resize(nextWidth, nextHeight) {
          width = nextWidth
          height = nextHeight
          pixelRatio = Math.min(window.devicePixelRatio || 1, 2)
          canvas.width = Math.round(width * pixelRatio)
          canvas.height = Math.round(height * pixelRatio)
          context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0)

          const columns = Math.ceil(width / spacing) + 1
          const rows = Math.ceil(height / spacing) + 1
          points = Array.from({ length: rows }, (_, row) =>
            Array.from({ length: columns }, (_, column) => ({
              x: column * spacing,
              y: row * spacing,
              drawX: column * spacing,
              drawY: row * spacing,
              g: 0,
              right: null,
              below: null,
            })),
          )

          for (let row = 0; row < rows; row += 1) {
            for (let column = 0; column < columns; column += 1) {
              const point = points[row][column]
              point.right = points[row][column + 1] || null
              point.below = points[row + 1]?.[column] || null
            }
          }

          if (!hasPointer) {
            easedX = width * 0.5
            easedY = height * 0.5
          }
        }

        const resizeObserver = new ResizeObserver(([entry]) => {
          resize(entry.contentRect.width, entry.contentRect.height)
        })
        resizeObserver.observe(document.documentElement)

        function enterWithPointer(event) {
          if (event.pointerType === 'touch') {
            touchMode = true
            hasPointer = false
            return
          }
          if (event.pointerType === 'mouse' || event.pointerType === 'pen') {
            hasPointer = true
            targetX = event.clientX
            targetY = event.clientY
          }
        }

        function movePointer(event) {
          if (event.pointerType === 'touch') {
            touchMode = true
            hasPointer = false
            return
          }
          if (!touchMode && (event.pointerType === 'mouse' || event.pointerType === 'pen')) {
            targetX = event.clientX
            targetY = event.clientY
          }
        }

        canvas.addEventListener('pointerenter', enterWithPointer, { passive: true })
        window.addEventListener('pointermove', movePointer, { passive: true })
        touchMedia.addEventListener?.('change', (event) => {
          if (event.matches) {
            touchMode = true
            hasPointer = false
          }
        })

        function frame(now) {
          const time = now * 0.001
          const sigma = 0.42 * Math.min(width, height)
          const pull = 0.30 * Math.min(width, height)

          if (!hasPointer || touchMode) {
            targetX = width * (0.5 + 0.34 * Math.sin(time * 0.7) * Math.cos(time * 0.23))
            targetY = height * (0.5 + 0.30 * Math.sin(time * 0.52 + 1.1))
          }

          easedX += (targetX - easedX) * 0.10
          easedY += (targetY - easedY) * 0.10

          context.fillStyle = '#08090b'
          context.fillRect(0, 0, width, height)

          const denominator = 2 * sigma * sigma
          for (const row of points) {
            for (const point of row) {
              const dx = easedX - point.x
              const dy = easedY - point.y
              const distanceSquared = dx * dx + dy * dy
              const g = Math.exp(-distanceSquared / denominator)
              const distance = Math.sqrt(distanceSquared)
              const offset = g * pull
              point.g = g
              point.drawX = point.x + (distance ? (dx / distance) * offset : 0)
              point.drawY = point.y + (distance ? (dy / distance) * offset : 0)
            }
          }

          context.fillStyle = accent
          for (const row of points) {
            for (const point of row) {
              context.globalAlpha = 0.16 + point.g * 0.62
              const radius = 0.9 + point.g * 1.9
              context.beginPath()
              context.arc(point.drawX, point.drawY, radius, 0, Math.PI * 2)
              context.fill()
            }
          }

          context.strokeStyle = accent
          context.lineWidth = 0.75
          for (const row of points) {
            for (const point of row) {
              if (point.right) drawLine(point, point.right)
              if (point.below) drawLine(point, point.below)
            }
          }

          context.globalAlpha = 1
          requestAnimationFrame(frame)
        }

        function drawLine(first, second) {
          const averageG = (first.g + second.g) * 0.5
          if (averageG < 0.004) return
          context.globalAlpha = 0.04 + averageG * 0.62
          context.beginPath()
          context.moveTo(first.drawX, first.drawY)
          context.lineTo(second.drawX, second.drawY)
          context.stroke()
        }

        requestAnimationFrame(frame)
      })()
    </script>
  </body>
</html>
